name: Apply database migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target database environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: database-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Validate and migrate ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require database configuration
        shell: bash
        run: test -n "$DATABASE_URL" || { echo 'DATABASE_URL is missing from this GitHub environment.'; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run db:migrate
