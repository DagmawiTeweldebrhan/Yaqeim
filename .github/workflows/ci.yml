name: Validate application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      DEMO_MODE: "true"
      UNIVERSITY_EMAIL_DOMAIN: nyu.edu
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Retain browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  pipeline:
    name: Ingestion contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: pipeline
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c pipeline/requirements.lock -e pipeline
      - run: python -m pip check
      - run: python -m unittest discover -s pipeline/tests -v
